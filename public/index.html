<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk WhatsApp Sender</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Bulk WhatsApp Sender</h1>
      <div id="connection-status" class="status disconnected">
        <span class="dot"></span>
        <span id="status-text">Connecting...</span>
      </div>
    </header>

    <div id="qr-section" class="qr-section hidden">
      <h2>Scan QR Code</h2>
      <p>Open WhatsApp on your phone > Settings > Linked Devices > Link a Device</p>
      <div id="qr-code"></div>
    </div>

    <nav class="tabs">
      <button class="tab active" data-tab="contacts">Contacts</button>
      <button class="tab" data-tab="templates">Templates</button>
      <button class="tab" data-tab="campaigns">Campaigns</button>
    </nav>

    <!-- Contacts Tab -->
    <section id="contacts-tab" class="tab-content active">
      <div class="section-header">
        <h2>Contacts</h2>
        <div class="actions">
          <button id="add-contact-btn" class="btn btn-primary">+ Add Contact</button>
          <button id="import-csv-btn" class="btn btn-secondary">Import CSV</button>
          <input type="file" id="csv-input" accept=".csv" hidden>
        </div>
      </div>

      <div id="add-contact-form" class="form-inline hidden">
        <input type="text" id="contact-name" placeholder="Name">
        <input type="text" id="contact-phone" placeholder="Phone (e.g. 919876543210)">
        <button id="save-contact-btn" class="btn btn-primary">Save</button>
        <button id="cancel-contact-btn" class="btn btn-secondary">Cancel</button>
      </div>

      <div class="table-wrapper">
        <table id="contacts-table">
          <thead>
            <tr>
              <th><input type="checkbox" id="select-all-contacts"></th>
              <th>Name</th>
              <th>Phone</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="contacts-body"></tbody>
        </table>
      </div>
      <p id="no-contacts" class="empty-msg">No contacts yet. Add contacts or import from CSV.</p>
    </section>

    <!-- Templates Tab -->
    <section id="templates-tab" class="tab-content">
      <div class="section-header">
        <h2>Message Templates</h2>
        <button id="add-template-btn" class="btn btn-primary">+ New Template</button>
      </div>

      <div id="add-template-form" class="form-block hidden">
        <input type="text" id="template-name" placeholder="Template Name">
        <textarea id="template-text" placeholder="Message text. Use {{name}} and {{phone}} as placeholders." rows="5"></textarea>
        <div class="form-actions">
          <button id="save-template-btn" class="btn btn-primary">Save</button>
          <button id="cancel-template-btn" class="btn btn-secondary">Cancel</button>
        </div>
      </div>

      <div id="templates-list"></div>
      <p id="no-templates" class="empty-msg">No templates yet.</p>
    </section>

    <!-- Campaigns Tab -->
    <section id="campaigns-tab" class="tab-content">
      <div class="section-header">
        <h2>Campaigns</h2>
        <button id="new-campaign-btn" class="btn btn-primary">+ New Campaign</button>
      </div>

      <div id="new-campaign-form" class="form-block hidden">
        <input type="text" id="campaign-name" placeholder="Campaign Name">
        <div class="form-row">
          <label>Template:</label>
          <select id="campaign-template"></select>
        </div>
        <div class="form-row">
          <label>Delay (seconds):</label>
          <input type="number" id="campaign-delay" value="5" min="3" max="60">
        </div>
        <div class="form-row">
          <label>Media (optional):</label>
          <input type="file" id="campaign-media" accept="image/*,video/*,.pdf,.doc,.docx">
        </div>
        <div class="form-row">
          <label>Select Contacts:</label>
          <div id="campaign-contacts" class="checkbox-list"></div>
        </div>
        <div class="form-actions">
          <button id="save-campaign-btn" class="btn btn-primary">Create Campaign</button>
          <button id="cancel-campaign-btn" class="btn btn-secondary">Cancel</button>
        </div>
      </div>

      <div id="campaigns-list"></div>
      <p id="no-campaigns" class="empty-msg">No campaigns yet.</p>
    </section>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
